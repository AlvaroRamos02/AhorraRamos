name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revisar los archivos de producción y su historial
        id: scan
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          snapshot="$(mktemp -d)"
          git ls-files -z -- src/ package.json package-lock.json |
            git checkout-index -z --stdin --prefix="$snapshot/"

          history_status=0
          snapshot_status=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner \
            --log-opts='--all --full-history --diff-merges=first-parent -- src/ package.json package-lock.json' \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-history.json" . || history_status=$?
          cd "$snapshot"
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-snapshot.json" . || snapshot_status=$?
          (( history_status == 0 && snapshot_status == 0 ))
      - name: Publicar tabla de secretos
        if: ${{ !cancelled() }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: node .github/scripts/security-summary.mjs gitleaks "$RUNNER_TEMP/gitleaks-history.json" "$RUNNER_TEMP/gitleaks-snapshot.json"

  sca:
    name: Dependencias (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar el inventario de paquetes
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Buscar vulnerabilidades conocidas
        id: scan
        run: npm audit --omit=dev --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit.json"
      - name: Publicar tabla de dependencias
        if: ${{ !cancelled() }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: node .github/scripts/security-summary.mjs npm-audit "$RUNNER_TEMP/npm-audit.json"

  sast:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Analizar el código de producción
        id: scan
        shell: bash
        run: |
          snapshot="$(mktemp -d)"
          git ls-files -z -- src/ | git checkout-index -z --stdin --prefix="$snapshot/"
          docker run --rm --volume "$snapshot:/repo:ro" --workdir /repo \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config p/javascript \
            --no-git-ignore --max-target-bytes=0 --metrics=off --disable-version-check --error --strict --json . \
            > "$RUNNER_TEMP/semgrep.json"
      - name: Publicar tabla de análisis estático
        if: ${{ !cancelled() }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: node .github/scripts/security-summary.mjs semgrep "$RUNNER_TEMP/semgrep.json"
